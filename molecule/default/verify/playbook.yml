---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if SSH service is running
      ansible.builtin.service:
        name: "{{ ansible_os_family == 'RedHat' and 'sshd' or 'ssh' }}"
        state: started
      check_mode: true
      register: ssh_service_check

    - name: Verify SSH service is running
      ansible.builtin.assert:
        that:
          - not ssh_service_check.changed
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"

    - name: Check SSH configuration file exists
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: ssh_config_file

    - name: Verify SSH configuration file exists
      ansible.builtin.assert:
        that:
          - ssh_config_file.stat.exists
        fail_msg: "SSH configuration file does not exist"
        success_msg: "SSH configuration file exists"

    - name: Load the role's variables
      ansible.builtin.include_vars: ../../../vars/main.yml

    - name: Load the role's defaults under a namespace (they must not override the scenario's host_vars)
      ansible.builtin.include_vars:
        file: ../../../defaults/main.yml
        name: role_defaults

    - name: Detect the OpenSSH version the way the role does
      ansible.builtin.include_tasks: ../../../tasks/openssh_version.yml
      vars:
        ssh_package: openssh-server

    - name: Read the effective sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd_effective
      changed_when: false

    - name: Index the effective configuration by directive
      ansible.builtin.set_fact:
        sshd_t: >-
          {% set d = {} %}{% for line in sshd_effective.stdout_lines %}{% set kv = line.split(' ', 1) %}
          {% if kv | length == 2 and kv[0] not in d %}{% set _ = d.update({kv[0]: kv[1]}) %}{% endif %}{% endfor %}{{ d }}

    - name: Verify the algorithm lists sshd runs with are the ones the role computed
      ansible.builtin.assert:
        that:
          - sshd_t['kexalgorithms'] == role_defaults.ssh_kex_algorithms | join(',')
          - sshd_t['ciphers'] == role_defaults.ssh_ciphers | join(',')
          - sshd_t['macs'] == role_defaults.ssh_macs | join(',')
          - sshd_t['hostkeyalgorithms'] == role_defaults.ssh_host_key_algorithms | join(',')
          - sshd_t['pubkeyacceptedalgorithms'] == role_defaults.ssh_pubkey_accepted_algorithms | join(',')
          - "'ecdsa' not in sshd_t['pubkeyacceptedalgorithms']"
          - "'diffie-hellman' not in sshd_t['kexalgorithms'] or openssh_version is version('10.0', '<')"
          - "'mlkem768x25519-sha256' in sshd_t['kexalgorithms'] or openssh_version is version('9.9', '<')"
        fail_msg: "sshd -T disagrees with the role on OpenSSH {{ openssh_version }}: {{ sshd_t | dict2items | selectattr('key', 'search', 'algorithms|ciphers|macs') | items2dict }}"

    - name: Verify the hardened session and connection settings
      ansible.builtin.assert:
        that:
          - sshd_t['loglevel'] == 'VERBOSE'
          - sshd_t['compression'] == 'no'
          - sshd_t['allowtcpforwarding'] == 'no'
          - sshd_t['allowstreamlocalforwarding'] == 'no'
          - sshd_t['allowagentforwarding'] == 'no'
          - sshd_t['x11forwarding'] == 'no'
          - sshd_t['permittunnel'] == 'no'
          - sshd_t['permituserenvironment'] == 'no'
          - sshd_t['hostbasedauthentication'] == 'no'
          - sshd_t['ignorerhosts'] == 'yes'
          - sshd_t['maxstartups'] == '10:30:60'
          - sshd_t['authorizedkeysfile'] == '.ssh/authorized_keys'

    - name: Read the moduli file
      ansible.builtin.command: awk '!/^#/ && NF >= 7 && $5 < 3071' /etc/ssh/moduli
      register: weak_moduli
      changed_when: false

    - name: Verify no modulus below 3072 bits is left
      ansible.builtin.assert:
        that: weak_moduli.stdout_lines | length == 0
        fail_msg: "{{ weak_moduli.stdout_lines | length }} moduli below 3072 bits remain"

    - name: Check if custom SSH port is configured
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "Port 12345"
        state: present
      check_mode: true
      register: ssh_port_check

    - name: Verify custom SSH port is configured
      ansible.builtin.assert:
        that:
          - not ssh_port_check.changed
        fail_msg: "Custom SSH port is not configured"
        success_msg: "Custom SSH port is configured"

    - name: Check if root login is disabled
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "PermitRootLogin no"
        state: present
      check_mode: true
      register: ssh_root_login_check

    - name: Verify root login is disabled
      ansible.builtin.assert:
        that:
          - not ssh_root_login_check.changed
        fail_msg: "Root login is not disabled"
        success_msg: "Root login is disabled"

    - name: Check if password authentication is disabled
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "PasswordAuthentication no"
        state: present
      check_mode: true
      register: ssh_password_auth_check

    - name: Verify password authentication is disabled
      ansible.builtin.assert:
        that:
          - not ssh_password_auth_check.changed
        fail_msg: "Password authentication is not disabled"
        success_msg: "Password authentication is disabled"

    - name: Test SSH connection to configured port
      ansible.builtin.wait_for:
        host: "{{ ansible_facts['default_ipv4']['address'] }}"
        port: 12345
        timeout: 10
        state: started
      register: ssh_connection_test

    - name: Verify SSH connection is possible
      ansible.builtin.assert:
        that:
          - ssh_connection_test is succeeded
        fail_msg: "SSH connection test failed - port 12345 is not accessible"
        success_msg: "SSH connection test successful - port 12345 is accessible"

    # ssh-audit (requirements-dev.txt) runs on the controller: some targets' Python is too old for it
    - name: Run ssh-audit from the controller against the configured port
      ansible.builtin.command: "ssh-audit {{ ansible_facts['default_ipv4']['address'] }}:12345"
      delegate_to: localhost
      become: false
      register: ssh_audit_result
      changed_when: false
      failed_when: false

    - name: Display ssh-audit results
      ansible.builtin.debug:
        var: ssh_audit_result.stdout_lines

    # ssh-audit exits 0 (good), 1 (connection error), 2 (warnings only) or 3 (failures)
    - name: Check ssh-audit exit code for critical issues
      ansible.builtin.assert:
        that:
          - ssh_audit_result.rc in [0, 2]
        fail_msg: "ssh-audit found critical security issues. Exit code: {{ ssh_audit_result.rc }}. Check the output above for details."
        success_msg: "ssh-audit security verification passed successfully"

    - name: Run ssh-audit in JSON format for detailed analysis
      ansible.builtin.command: "ssh-audit --json {{ ansible_facts['default_ipv4']['address'] }}:12345"
      delegate_to: localhost
      become: false
      register: ssh_audit_json_result
      changed_when: false
      failed_when: false

    - name: Parse ssh-audit JSON results
      ansible.builtin.set_fact:
        ssh_audit_json: "{{ ssh_audit_json_result.stdout | from_json }}"
      when: ssh_audit_json_result.rc in [0, 2]

    - name: Verify no critical or high severity findings
      ansible.builtin.assert:
        that:
          - ssh_audit_json_result.rc in [0, 2]
          - ssh_audit_json.banner is defined
          - ssh_audit_json.banner.software is defined
        fail_msg: "ssh-audit JSON output is missing expected fields"
        success_msg: "ssh-audit completed analysis successfully"

    - name: Check for weak algorithms (if any are reported)
      ansible.builtin.debug:
        msg: "SSH-Audit analysis completed. Check output above for any security recommendations."
