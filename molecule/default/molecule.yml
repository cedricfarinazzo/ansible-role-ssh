---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    hostname: molecule
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare/playbook.yml
    converge: converge/playbook.yml
    verify: verify/playbook.yml
  inventory:
    host_vars:
      instance:
        # The container runs as root; EL sudo fails PAM account checks on GitHub runners (see CLAUDE.md)
        ansible_become: false
        ssh_port: 12345
        # The controller audits from the docker bridge; OpenSSH 9.8+ would penalise the repeated audits
        ssh_per_source_penalty_exempt_list: [172.16.0.0/12]
        ssh_port_migration: true
        ssh_port_migration_from: 22
verifier:
  name: ansible
scenario:
  name: default
  create_sequence:
    - dependency
    - create
  check_sequence:
    - create
    - converge
    - check
  converge_sequence:
    - dependency
    - create
    - prepare
    - converge
  destroy_sequence:
    - destroy
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge # install the role
    - verify
    - idempotence
    - verify
    - destroy
