name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint

  molecule:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - debian13
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
          - rockylinux9
          - rockylinux10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ansible-core in requirements-dev.txt needs Python 3.13+
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run the molecule scenario on ${{ matrix.distro }}
        run: ./run-tests.sh ${{ matrix.distro }}

  # Molecule's docker connection ignores ansible_port: the port migration is tested over real SSH.
  migration:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: debian13, args: ""}
          # No EL leg: on GitHub runners the EL containers refuse the test key in PAM's account phase
          # (unix_chkpwd: could not obtain user info). EL passes this test locally and Molecule covers it here.
          - {distro: ubuntu2404, args: ""}
          - {distro: ubuntu2404, args: "-e ssh_socket_activation=true"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - name: Port migration over SSH on ${{ matrix.distro }} ${{ matrix.args }}
        run: tests/migration/run.sh ${{ matrix.distro }} ${{ matrix.args }}
