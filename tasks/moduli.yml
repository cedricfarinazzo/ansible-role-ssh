---
# /etc/ssh/moduli tops out at 8192 bits; above that the filter would empty it.
- name: Check the moduli minimum
  ansible.builtin.assert:
    that: ssh_moduli_minimum | int <= 8192
    fail_msg: "ssh_moduli_minimum {{ ssh_moduli_minimum }} is above 8192, the largest modulus shipped"
    quiet: true

- name: Read the Diffie-Hellman moduli
  ansible.builtin.slurp:
    src: /etc/ssh/moduli
  register: ssh_moduli_file

- name: Keep only moduli of at least ssh_moduli_minimum bits
  ansible.builtin.template:
    src: moduli.j2
    dest: /etc/ssh/moduli
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart SSH service
