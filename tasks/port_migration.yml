---
# Stage A listens on both ports and proves a login on the new one; until then the old port stays a way in.
- name: Listen on ssh_port next to ssh_port_migration_from
  block:
    - name: Keep the sshd_config that works today
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.pre-port-migration
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Write the configuration with both ports
      ansible.builtin.include_tasks: config.yml
      vars:
        openssh_extra_listen_ports: ["{{ ssh_port_migration_from }}"]
        ssh_port_migration: false

    - name: Restart sshd on both ports
      ansible.builtin.meta: flush_handlers

    - name: Use ssh_port for the next connections
      ansible.builtin.set_fact:
        ansible_port: "{{ ssh_port }}"

    - name: Reopen the connection on ssh_port
      ansible.builtin.meta: reset_connection

    - name: Prove the login works on ssh_port
      ansible.builtin.wait_for_connection:
        timeout: "{{ ssh_port_migration_timeout }}"

  rescue:
    - name: Go back to ssh_port_migration_from
      ansible.builtin.set_fact:
        ansible_port: "{{ ssh_port_migration_from }}"

    - name: Reopen the connection on the old port
      ansible.builtin.meta: reset_connection

    - name: Put the working sshd_config back
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config.pre-port-migration
        dest: /etc/ssh/sshd_config
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Restart sshd on the old configuration
      ansible.builtin.include_tasks: restart.yml

    - name: Stop the migration
      ansible.builtin.fail:
        msg: "sshd did not answer on port {{ ssh_port }}; the previous sshd_config is back on port {{ ssh_port_migration_from }}"

# Stage B drops the old port; a refused config puts stage A back, which still answers on ssh_port.
- name: Drop ssh_port_migration_from
  block:
    - name: Keep the two-port sshd_config
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.pre-port-migration-final
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Write the final configuration
      ansible.builtin.include_tasks: config.yml
      vars:
        ssh_port_migration: false

    - name: Restart sshd on ssh_port only
      ansible.builtin.meta: flush_handlers

    - name: Reopen the connection
      ansible.builtin.meta: reset_connection

    - name: Prove the login still works on ssh_port
      ansible.builtin.wait_for_connection:
        timeout: "{{ ssh_port_migration_timeout }}"

  rescue:
    - name: Put the two-port sshd_config back
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config.pre-port-migration-final
        dest: /etc/ssh/sshd_config
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Restart sshd on the two-port configuration
      ansible.builtin.include_tasks: restart.yml

    - name: Stop the migration
      ansible.builtin.fail:
        msg: "The final sshd_config failed; sshd is back on ports {{ ssh_port }} and {{ ssh_port_migration_from }}"
