---
- name: Reload systemd so the ssh.socket generator reads the new port
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: openssh_socket_activated | default(false)
  listen: Restart SSH service

- name: Restart ssh.socket
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
  when: openssh_socket_activated | default(false)
  listen: Restart SSH service

- name: Restart the SSH service
  ansible.builtin.service:
    name: "{{ ssh_service_name }}"
    state: restarted
  when: not (openssh_socket_activated | default(false))
  listen: Restart SSH service
